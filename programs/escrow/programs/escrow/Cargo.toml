[package]
name = "escrow"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = "=1.1.2"

[dev-dependencies]
litesvm = { version = "=0.10.0", features = ["precompiles"] }
solana-message = "=3.1.0"
solana-transaction = "=3.1.0"
solana-signer = "=3.0.1"
solana-keypair = "=3.1.2"
serde_json = "=1.0.151"
solana-ed25519-program = "=3.0.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
